repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check . --fix
        language: system
        pass_filenames: false
      - id: ruff-format-check
        name: ruff format
        entry: .venv/bin/ruff format .
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: .venv/bin/pytest -q
        language: system
        pass_filenames: false
